name: Trading 212 Market Hours Live Runner

on:
  # Automated triggers are driven exclusively by Cloudflare Worker Cron Triggers
  # (07:55 UTC and 12:25 UTC Mon-Fri via https://leveraged-etp-engine.11shahpratik.workers.dev/)
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Active Strategy to execute'
        required: false
        default: 'vwap'
        type: choice
        options:
          - vwap
          - ml_alpha
      use_live:
        description: 'Execution mode: false (DEMO practice) or true (LIVE account)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      duration_minutes:
        description: 'Duration in minutes to run the engine (defaults to 270 or remaining market minutes until 16:35 UTC)'
        required: false
        default: '270'
        type: string

permissions:
  contents: write

jobs:
  run-market-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 🛡️ Pre-Flight Market Hours Check
        id: market_check
        run: |
          DOW=$(date -u +%u) # 1=Monday ... 7=Sunday
          HOUR=$(date -u +%H)
          MINUTE=$(date -u +%M)
          CURRENT_MINS=$(( 10#$HOUR * 60 + 10#$MINUTE ))

          echo "Evaluated UTC time: $(date -u +'%Y-%m-%d %H:%M UTC') (Day of week: $DOW)"
          if [ "$DOW" -gt 5 ]; then
            echo "ℹ️ Weekend execution (DOW: $DOW). European markets (LSE) are CLOSED."
          elif [ "$CURRENT_MINS" -lt 470 ] || [ "$CURRENT_MINS" -gt 995 ]; then
            echo "ℹ️ Execution outside regular trading hours (08:00 - 16:30 UTC / 09:00 - 17:30 CET)."
          else
            echo "✅ LSE Market is OPEN (08:00 - 16:30 UTC / 09:00 - 17:30 CET)."
          fi
          echo "should_run=true" >> "$GITHUB_OUTPUT"

      - name: 🐍 Set up Python 3.11
        if: steps.market_check.outputs.should_run != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Python Dependencies
        if: steps.market_check.outputs.should_run != 'false'
        run: |
          python -m pip install --upgrade pip
          pip install -r trading_system/requirements.txt

      - name: 🔐 Prepare Dashboard Authentication Token
        id: dash_auth
        if: steps.market_check.outputs.should_run != 'false'
        env:
          CONFIGURED_TOKEN: ${{ secrets.DASHBOARD_AUTH_TOKEN || secrets.PANIC_FLATTEN_TOKEN }}
        run: |
          mkdir -p data
          if [ -n "$CONFIGURED_TOKEN" ]; then
            echo "Using user-configured DASHBOARD_AUTH_TOKEN secret."
            printf '%s\n' "$CONFIGURED_TOKEN" > data/.dashboard_token
            chmod 600 data/.dashboard_token
            echo "has_custom_token=true" >> "$GITHUB_OUTPUT"
          else
            SESSION_TOKEN=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
            printf '%s\n' "$SESSION_TOKEN" > data/.dashboard_token
            chmod 600 data/.dashboard_token
            echo "has_custom_token=false" >> "$GITHUB_OUTPUT"
            echo "session_token=$SESSION_TOKEN" >> "$GITHUB_OUTPUT"
          fi

      - name: 🌐 Install Cloudflare Tunnel
        if: steps.market_check.outputs.should_run != 'false'
        run: |
          if curl -fsSL --retry 3 --retry-delay 2 \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared; then
            chmod +x /usr/local/bin/cloudflared
            /usr/local/bin/cloudflared --version || true
          else
            echo "⚠️ Failed to download cloudflared binary; SSH fallback tunnel will be used if needed."
          fi

      - name: 🚀 Start Live Dashboard Tunnel & Publish Access Details
        id: tunnel
        if: steps.market_check.outputs.should_run != 'false'
        env:
          CF_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          CF_TUNNEL_URL: ${{ secrets.CLOUDFLARE_TUNNEL_URL }}
          IS_PRIVATE_REPO: ${{ github.event.repository.private }}
        run: |
          TUNNEL_URL=""
          TUNNEL_PROVIDER=""

          # Tier 1: Persistent Named Cloudflare Tunnel (when configured via GitHub Secrets)
          if [ -n "${CF_TUNNEL_TOKEN:-}" ] && [ -x /usr/local/bin/cloudflared ]; then
            echo "Starting configured Named Cloudflare Tunnel..."
            rm -f /tmp/cloudflared.log
            setsid /usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 run --token "$CF_TUNNEL_TOKEN" </dev/null >/tmp/cloudflared.log 2>&1 &
            CF_PID=$!
            sleep 5
            if kill -0 "$CF_PID" 2>/dev/null && [ -n "${CF_TUNNEL_URL:-}" ]; then
              TUNNEL_URL="$CF_TUNNEL_URL"
              TUNNEL_PROVIDER="Cloudflare Named Tunnel (HTTP/2)"
            else
              echo "⚠️ Named Cloudflare Tunnel failed or CLOUDFLARE_TUNNEL_URL secret is unset."
              cat /tmp/cloudflared.log || true
              kill "$CF_PID" 2>/dev/null || true
            fi
          fi

          # Tier 2: Cloudflare Quick Tunnel via TCP/HTTP2 (avoids Azure QUIC UDP stalls)
          if [ -z "$TUNNEL_URL" ] && [ -x /usr/local/bin/cloudflared ]; then
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3: Starting Cloudflare Quick Tunnel (http2)..."
              rm -f /tmp/cloudflared.log
              setsid /usr/local/bin/cloudflared tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:8080 </dev/null >/tmp/cloudflared.log 2>&1 &
              CF_PID=$!
              for _ in {1..8}; do
                TUNNEL_URL=$(grep -o 'https://[-a-zA-Z0-9]*\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)
                if [ -n "$TUNNEL_URL" ]; then
                  TUNNEL_PROVIDER="Cloudflare Quick Tunnel (HTTP/2)"
                  break 2
                fi
                if ! kill -0 "$CF_PID" 2>/dev/null || grep -qiE 'failed to request quick Tunnel|Too Many Requests|429' /tmp/cloudflared.log 2>/dev/null; then
                  break
                fi
                sleep 2
              done
              echo "Cloudflare Quick Tunnel attempt ${attempt} did not return a URL:"
              cat /tmp/cloudflared.log 2>/dev/null || true
              kill "$CF_PID" 2>/dev/null || true
              wait "$CF_PID" 2>/dev/null || true
              sleep $((attempt * 2))
            done
          fi

          # Tier 3: Automatic localhost.run SSH HTTPS fallback if trycloudflare.com is throttled
          if [ -z "$TUNNEL_URL" ]; then
            echo "⚠️ Cloudflare Quick Tunnel unavailable; falling back to localhost.run SSH HTTPS tunnel..."
            rm -f /tmp/lhr.log
            setsid ssh -T \
              -o PubkeyAuthentication=no \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=10 \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=3 \
              -o ExitOnForwardFailure=yes \
              -R 80:127.0.0.1:8080 nokey@localhost.run </dev/null >/tmp/lhr.log 2>&1 &
            LHR_PID=$!
            for _ in {1..10}; do
              TUNNEL_URL=$(grep -oE 'https://[-a-zA-Z0-9.]+\.lhr\.life' /tmp/lhr.log | head -n 1 || true)
              if [ -n "$TUNNEL_URL" ]; then
                TUNNEL_PROVIDER="localhost.run SSH Fallback Tunnel"
                break
              fi
              if ! kill -0 "$LHR_PID" 2>/dev/null; then
                break
              fi
              sleep 2
            done
            if [ -z "$TUNNEL_URL" ]; then
              kill "$LHR_PID" 2>/dev/null || true
            fi
          fi

          if [ -n "$TUNNEL_URL" ]; then
            TUNNEL_HOST=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlsplit(sys.argv[1]).hostname or "")' "$TUNNEL_URL")
            echo "TUNNEL_URL=$TUNNEL_URL" >> "$GITHUB_ENV"
            if [ -n "$TUNNEL_HOST" ]; then
              echo "DASHBOARD_ALLOWED_HOSTS=$TUNNEL_HOST" >> "$GITHUB_ENV"
            fi
            {
              echo "### 📊 Live Trading Dashboard"
              echo "Access your live signals and control workbench anywhere (phone/desktop):"
              echo "👉 **[Open Live Dashboard]($TUNNEL_URL)** (\`$TUNNEL_URL\`)"
              echo "- **Tunnel Provider:** ${TUNNEL_PROVIDER}"
              echo ""
              echo "### 🔐 Control Plane Access"
              echo "The dashboard is **Read-Only** by default for public monitoring."
              if [ "${{ steps.dash_auth.outputs.has_custom_token }}" = "true" ]; then
                echo "To unlock mutating actions (Panic Flatten, manual exits, parameter staging), paste your configured \`DASHBOARD_AUTH_TOKEN\` secret."
              elif [ "${IS_PRIVATE_REPO:-false}" = "true" ]; then
                echo "To unlock mutating actions (Panic Flatten, manual exits, parameter staging), paste this session token into the **Unlock** modal:"
                echo "🔑 \`${{ steps.dash_auth.outputs.session_token }}\`"
              else
                echo "ℹ️ Public repository guard: session unlock token is not printed in public workflow summaries."
                echo "Check your private Telegram bot alert for this session's unlock token, or configure a \`DASHBOARD_AUTH_TOKEN\` GitHub Secret."
              fi
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "=========================================================="
            echo "🎉 LIVE DASHBOARD ONLINE ($TUNNEL_PROVIDER): $TUNNEL_URL"
            echo "=========================================================="
          else
            {
              echo "### ⚠️ Live Trading Dashboard Tunnel Unavailable"
              echo "Cloudflare Tunnel and fallback SSH tunnel both failed to allocate a public URL for this run."
              echo ""
              echo "<details><summary>Tunnel Diagnostics Log</summary>"
              echo ""
              echo '```text'
              tail -n 40 /tmp/cloudflared.log /tmp/lhr.log 2>/dev/null || echo "No tunnel logs recorded."
              echo '```'
              echo "</details>"
              echo ""
            } >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ Could not extract any dashboard tunnel URL; logs:"
            cat /tmp/cloudflared.log /tmp/lhr.log 2>/dev/null || true
          fi

      - name: 📈 Execute Quantitative Leveraged Trading Engine
        if: steps.market_check.outputs.should_run != 'false'
        env:
          TRADING212_API_KEY: ${{ secrets.TRADING212_API_KEY }}
          TRADING212_API_SECRET: ${{ secrets.TRADING212_API_SECRET }}
          DASHBOARD_AUTH_TOKEN: ${{ secrets.DASHBOARD_AUTH_TOKEN || secrets.PANIC_FLATTEN_TOKEN }}
          SESSION_UNLOCK_TOKEN: ${{ steps.dash_auth.outputs.session_token }}
          REPO_IS_PRIVATE: ${{ github.event.repository.private }}
          USE_LIVE: 'false'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          DASHBOARD_HOST: '0.0.0.0'
          DASHBOARD_PORT: '8080'
          LIVE_DASHBOARD_PUBLIC_URL: ${{ env.TUNNEL_URL }}
        run: |
          # Calculate session duration
          INPUT_DURATION="${{ inputs.duration_minutes }}"
          
          # If no custom duration is provided or default '270' is used (e.g. from Cloudflare Worker cron),
          # dynamically calculate remaining market minutes until 16:35 UTC (capped at 270m).
          if [ -z "$INPUT_DURATION" ] || [ "$INPUT_DURATION" = "270" ]; then
            HOUR=$(date -u +%H)
            MINUTE=$(date -u +%M)
            CURRENT_MINS=$(( 10#$HOUR * 60 + 10#$MINUTE ))
            MARKET_CLOSE_MINS=995 # 16:35 UTC (LSE close + 5m buffer)
            REMAINING_MINS=$(( MARKET_CLOSE_MINS - CURRENT_MINS ))
            
            if [ "$CURRENT_MINS" -ge 470 ] && [ "$CURRENT_MINS" -le 995 ]; then
              # Within regular market window (07:50 - 16:35 UTC)
              if [ "$REMAINING_MINS" -lt 270 ]; then
                DURATION="$REMAINING_MINS"
              else
                DURATION="270"
              fi
              echo "⏱️ Dynamically calculated session duration: ${DURATION}m (Market closes at 16:35 UTC / 17:35 CET)"
            else
              DURATION="270"
              echo "⏱️ Outside regular market hours: defaulting session duration to ${DURATION}m"
            fi
          else
            DURATION="$INPUT_DURATION"
            echo "⏱️ Custom manual session duration: ${DURATION}m"
          fi

          STRATEGY_CHOICE="${{ inputs.strategy || 'vwap' }}"
          USE_LIVE_CHOICE="${{ inputs.use_live || 'false' }}"
          export STRATEGY_CHOICE
          export USE_LIVE="$USE_LIVE_CHOICE"
          
          echo "=========================================================="
          echo "🚀 Starting Quantitative Leveraged Trading Engine"
          echo "🎯 Strategy: ${STRATEGY_CHOICE}"
          echo "⏱️ Duration: ${DURATION}m"
          echo "⚙️ Mode: USE_LIVE=${USE_LIVE_CHOICE}"
          if [ -n "${LIVE_DASHBOARD_PUBLIC_URL:-}" ]; then
            echo "📊 Live Dashboard: ${LIVE_DASHBOARD_PUBLIC_URL}"
          else
            echo "📊 Live Dashboard: Tunnel unavailable (local gateway on 8080 only)"
          fi
          echo "🌐 Market Data Providers:"
          [ -n "${POLYGON_API_KEY}" ] && echo "  - Polygon.io: CONFIGURED (Key Detected)" || echo "  - Polygon.io: Not configured"
          [ -n "${FMP_API_KEY}" ] && echo "  - Financial Modeling Prep (FMP): CONFIGURED (Key Detected)" || echo "  - FMP: Not configured"
          [ -n "${TIINGO_API_KEY}" ] && echo "  - Tiingo: CONFIGURED (Key Detected)" || echo "  - Tiingo: Not configured"
          [ -n "${ALPHA_VANTAGE_API_KEY}" ] && echo "  - Alpha Vantage: CONFIGURED (Key Detected)" || echo "  - Alpha Vantage: Not configured"
          echo "  - Direct Yahoo Chart API: ACTIVE (Keyless fallback)"
          echo "  - Stooq CSV: ACTIVE (Keyless fallback)"
          echo "=========================================================="

          # Notify Telegram/Discord with the live dashboard link once the HTTP gateway binds :8080
          NOTIFY_PID=""
          cleanup_notify() {
            [ -n "${NOTIFY_PID:-}" ] && kill "$NOTIFY_PID" 2>/dev/null || true
          }
          trap cleanup_notify EXIT
          if [ -n "${LIVE_DASHBOARD_PUBLIC_URL:-}" ]; then
            python3 -c '
          import json, os, time, urllib.request
          url = os.environ.get("LIVE_DASHBOARD_PUBLIC_URL", "").strip()
          tg_token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          tg_chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          dc_hook = os.environ.get("DISCORD_WEBHOOK_URL", "").strip()
          strat = os.environ.get("STRATEGY_CHOICE", "vwap")
          mode = "LIVE" if os.environ.get("USE_LIVE", "false").lower() == "true" else "DEMO"
          for _ in range(90):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8080/api/data", timeout=2) as r:
                      if r.status == 200:
                          break
              except Exception:
                  time.sleep(2)
          else:
              raise SystemExit(0)
          msg = f"📊 Live Dashboard Online ({strat} | {mode})\n👉 {url}"
          tok = os.environ.get("SESSION_UNLOCK_TOKEN", "").strip()
          if tg_token and tg_chat:
              tg_msg = msg + (f"\n🔑 Session Unlock Token: {tok}" if tok else "")
              try:
                  req = urllib.request.Request(
                      f"https://api.telegram.org/bot{tg_token}/sendMessage",
                      data=json.dumps({"chat_id": tg_chat, "text": tg_msg}).encode(),
                      headers={"Content-Type": "application/json"},
                  )
                  urllib.request.urlopen(req, timeout=5).read()
              except Exception:
                  pass
          if dc_hook:
              try:
                  req = urllib.request.Request(
                      dc_hook,
                      data=json.dumps({"content": msg}).encode(),
                      headers={"Content-Type": "application/json"},
                  )
                  urllib.request.urlopen(req, timeout=5).read()
              except Exception:
                  pass
          ' &
            NOTIFY_PID=$!
          fi
          
          python3 -m trading_system.orchestrator \
            --strategy "$STRATEGY_CHOICE" \
            --interval 5 \
            --monitor-interval 10 \
            --dashboard-port 8080 \
            --dashboard-host 0.0.0.0 \
            --duration-minutes "$DURATION"

      - name: 💾 Synchronize Active Trades State to Repository
        if: always() && steps.market_check.outputs.should_run != 'false'
        run: |
          rm -f data/.dashboard_token
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Market Runner"
          CURRENT_BRANCH="${{ github.ref_name }}"
          [ -z "$CURRENT_BRANCH" ] && CURRENT_BRANCH="main"
          git pull origin "$CURRENT_BRANCH" --rebase || true
          git add active_trades.json trades.jsonl data/ 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(state): persist active trades from market runner [skip ci]"
            git push origin "$CURRENT_BRANCH"
            echo "✅ Successfully synced active trades and logs back to $CURRENT_BRANCH."
          else
            echo "ℹ️ No changes in active trades or logs to persist."
          fi
